name: 🔄 Update Profile Stats

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Generate custom SVG stat cards via Python
  # ──────────────────────────────────────────────────────────────
  generate-svgs:
    name: Generate SVG Cards
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Create assets directory
        run: mkdir -p assets

      - name: Run SVG generator
        env:
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: gurukannan22
        run: python .github/scripts/generate_stats.py

      - name: Commit & push generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg assets/stats.svg assets/langs.svg
          git diff --cached --quiet || git commit -m "chore: auto-update stats SVGs [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gurukannan22/gurukannan22.git main

  # ──────────────────────────────────────────────────────────────
  # Job 2 — Regenerate contribution snake animation
  # ──────────────────────────────────────────────────────────────
  generate-snake:
    name: Generate Contribution Snake
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Snake SVG (dark + light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: gurukannan22
          outputs: |
            dist/snake-dark.svg?palette=github-dark
            dist/snake-light.svg

      - name: Deploy to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch:         output
          folder:         dist
          token:          ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-update snake animation [skip ci]"
          single-commit:  true
          clean:          true
