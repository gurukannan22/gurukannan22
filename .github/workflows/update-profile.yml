name: 🔄 Update Profile Stats

on:
  schedule:
    # Refresh profile data twice an hour. GitHub may delay scheduled jobs
    # during busy periods, but this keeps the profile much fresher than 6h.
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job 1 — Generate custom SVG stat cards via Python
  # ──────────────────────────────────────────────────────────────
  generate-svgs:
    name: Generate SVG Cards
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create assets directory
        run: mkdir -p assets

      - name: Run SVG generator
        env:
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: gurukannan22
          # City for the banner's live weather scene (shown when no festival is near)
          WEATHER_CITY: Chennai
          WEATHER_LAT: "13.0827"
          WEATHER_LON: "80.2707"
        run: python .github/scripts/generate_stats.py

      - name: Commit & push generated SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: auto-update stats SVGs [skip ci]"
          git pull --rebase origin main
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/gurukannan22/gurukannan22.git HEAD:main
