<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
<defs>
  <style>
    @keyframes rise { from { opacity:0; transform:translateY(12px) } to { opacity:1; transform:translateY(0) } }
    @keyframes pulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes dash { to { stroke-dashoffset:-120 } }
    @keyframes scan { from { transform:translateY(-8px) } to { transform:translateY(288px) } }
    .mono { font-family:"SFMono-Regular","Cascadia Code","Courier New",monospace }
    .sans { font-family:"Segoe UI",Ubuntu,"Helvetica Neue",Arial,sans-serif }
  </style>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#010409"/>
    <stop offset="56%" stop-color="#0D1117"/>
    <stop offset="100%" stop-color="#14101f"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#58A6FF"/>
    <stop offset="45%" stop-color="#3FB950"/>
    <stop offset="72%" stop-color="#F0B429"/>
    <stop offset="100%" stop-color="#BC8CFF"/>
  </linearGradient>
  <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect width="900" height="280" rx="18"/></clipPath>
</defs>

<rect width="900" height="280" rx="18" fill="url(#bg)"/>
<g opacity=".08">
  <path d="M45 226 C170 128 257 309 387 190 S604 48 852 147" fill="none" stroke="#58A6FF" stroke-width="1.2" stroke-dasharray="7 9">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M43 79 C178 118 238 2 395 65 S626 245 857 68" fill="none" stroke="#BC8CFF" stroke-width="1.2" stroke-dasharray="5 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="10s" repeatCount="indefinite"/>
  </path>
</g>
<g clip-path="url(#clip)">
  <rect x="0" y="0" width="900" height="6" fill="#58A6FF" opacity=".06" style="animation:scan 4.8s linear infinite"/>
</g>
<rect x="1" y="1" width="898" height="278" rx="17" fill="none" stroke="#30363D"/>
<rect x="0" y="0" width="900" height="4" fill="url(#accent)"/>

<text x="34" y="42" class="mono" font-size="10" font-weight="700" letter-spacing="2" fill="#7D8590">MISSION CONTROL</text>
<text x="34" y="73" class="sans" font-size="28" font-weight="800" fill="#F0F6FC">Current Build Queue</text>
<text x="34" y="96" class="mono" font-size="12" fill="#7D8590">Backend systems, cloud depth, and teaching loops running in parallel.</text>

<g transform="translate(672 35)">
  <rect width="181" height="34" rx="17" fill="#3FB95018" stroke="#3FB950" stroke-opacity=".7"/>
  <circle cx="22" cy="17" r="5" fill="#3FB950" style="animation:pulse 1.3s ease-in-out infinite"/>
  <text x="38" y="22" class="mono" font-size="11" font-weight="800" fill="#3FB950">ONLINE / SHIPPING</text>
</g>

<g transform="translate(34 124)">
  <rect width="196" height="112" rx="14" fill="#161B22" stroke="#58A6FF" stroke-opacity=".38"/>
  <rect x="0" y="0" width="196" height="3" fill="#58A6FF"/>
  <text x="18" y="32" class="mono" font-size="10" font-weight="800" fill="#58A6FF">01 / CRM ENGINE</text>
  <text x="18" y="60" class="sans" font-size="18" font-weight="800" fill="#F0F6FC">NueCRM</text>
  <text x="18" y="82" class="mono" font-size="11" fill="#7D8590">Leads, invoices, trainer</text>
  <text x="18" y="100" class="mono" font-size="11" fill="#7D8590">portal, finance flows</text>
</g>

<g transform="translate(252 124)">
  <rect width="196" height="112" rx="14" fill="#161B22" stroke="#3FB950" stroke-opacity=".38"/>
  <rect x="0" y="0" width="196" height="3" fill="#3FB950"/>
  <text x="18" y="32" class="mono" font-size="10" font-weight="800" fill="#3FB950">02 / EVENTS</text>
  <text x="18" y="60" class="sans" font-size="18" font-weight="800" fill="#F0F6FC">Kafka + Solace</text>
  <text x="18" y="82" class="mono" font-size="11" fill="#7D8590">Consumer groups, DLQ,</text>
  <text x="18" y="100" class="mono" font-size="11" fill="#7D8590">topic design, resilience</text>
</g>

<g transform="translate(470 124)">
  <rect width="196" height="112" rx="14" fill="#161B22" stroke="#F0B429" stroke-opacity=".38"/>
  <rect x="0" y="0" width="196" height="3" fill="#F0B429"/>
  <text x="18" y="32" class="mono" font-size="10" font-weight="800" fill="#F0B429">03 / CLOUD</text>
  <text x="18" y="60" class="sans" font-size="18" font-weight="800" fill="#F0F6FC">AWS SAA Track</text>
  <text x="18" y="82" class="mono" font-size="11" fill="#7D8590">VPC, ECS, IAM, RDS,</text>
  <text x="18" y="100" class="mono" font-size="11" fill="#7D8590">Lambda, architectures</text>
</g>

<g transform="translate(688 124)">
  <rect width="178" height="112" rx="14" fill="#161B22" stroke="#BC8CFF" stroke-opacity=".38"/>
  <rect x="0" y="0" width="178" height="3" fill="#BC8CFF"/>
  <text x="18" y="32" class="mono" font-size="10" font-weight="800" fill="#BC8CFF">04 / TEACHING</text>
  <text x="18" y="60" class="sans" font-size="18" font-weight="800" fill="#F0F6FC">Java + DSA</text>
  <text x="18" y="82" class="mono" font-size="11" fill="#7D8590">Placement-first full</text>
  <text x="18" y="100" class="mono" font-size="11" fill="#7D8590">stack learning paths</text>
</g>

<line x1="54" y1="256" x2="846" y2="256" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 10" filter="url(#softGlow)">
  <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="6s" repeatCount="indefinite"/>
</line>
<text x="450" y="266" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#7D8590">ship useful systems - teach durable fundamentals - keep improving</text>
</svg>
