<!-- Corner brackets -->
<path d="M 30 10 L 10 10 L 10 30" stroke="#F0B429" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".85"/><path d="M 870 10 L 890 10 L 890 30" stroke="#F0B429" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".85"/><path d="M 10 170 L 10 190 L 30 190" stroke="#F0B429" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".85"/><path d="M 870 190 L 890 190 L 890 170" stroke="#F0B429" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".85"/>

<!-- Top gradient bar -->
<rect x="0" y="0" width="900" height="3.5" fill="url(#topG)"/>

<!-- Name -->
<text x="450" y="98" text-anchor="middle"
  font-family="'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif"
  font-size="58" font-weight="800" letter-spacing="-1"
  fill="url(#nameG)" filter="url(#gN)"
  style="animation:nameIn .9s cubic-bezier(.16,1,.3,1) both, glowN 3.5s 1.8s ease-in-out infinite">
  GURU KANNAN
</text>

<!-- Subtitle -->
<text x="450" y="130" text-anchor="middle"
  font-family="'Courier New',Courier,monospace"
  font-size="12.5" font-weight="500" letter-spacing=".24em" fill="#7D8590"
  style="animation:subIn 1s .5s ease both">
  SYSTEM ENGINEER  ·  FULL STACK DEVELOPER  ·  TECH EDUCATOR
</text>

<!-- Growing accent bar -->
<rect x="450" y="148" width="0" height="2" rx="1" fill="url(#topG)">
  <animate attributeName="width" from="0" to="190" dur=".9s" begin=".9s" fill="freeze"
    calcMode="spline" keyTimes="0;1" keySplines=".22 1 .36 1"/>
  <animate attributeName="x" from="450" to="355" dur=".9s" begin=".9s" fill="freeze"
    calcMode="spline" keyTimes="0;1" keySplines=".22 1 .36 1"/>
</rect>

<!-- Status chip -->
<rect x="398" y="158" width="104" height="22" rx="11"
  fill="#3FB95018" stroke="#3FB950" stroke-width=".9"
  style="animation:chipIn .7s 1.3s cubic-bezier(.34,1.56,.64,1) both"/>
<circle cx="418" cy="169" r="0" fill="#3FB950">
  <animate attributeName="r"       values="3.5;5.5;3.5" dur="1.5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;.2;1"       dur="1.5s" repeatCount="indefinite"/>
</circle>
<text x="430" y="174" text-anchor="start"
  font-family="'Courier New',monospace" font-size="10" font-weight="700" fill="#3FB950"
  style="animation:chipIn .7s 1.3s cubic-bezier(.34,1.56,.64,1) both">
  ONLINE · SHIPPING
</text>

</svg>