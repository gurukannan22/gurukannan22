<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif">

<defs>
  <style>
    .mono { font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace }
    .t    { font-size:14px }
    .cur  { animation:blink 1.1s step-end infinite }
    .psst { opacity:0; animation:psst 23s 6s linear infinite }
    .inv  { animation:fly 41s 9s linear infinite; transform:translateX(-60px) }
    .pulse { animation:pulse 1.8s ease-in-out infinite }
    @keyframes blink { 50% { opacity:0 } }
    @keyframes psst  { 0%,91% { opacity:0 } 92%,98% { opacity:.9 } 100% { opacity:0 } }
    @keyframes fly   { 0% { transform:translateX(-60px) } 14%,100% { transform:translateX(1260px) } }
    @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.35 } }
    
.fx-fall    { animation:fx-fall linear infinite }
.fx-rise    { animation:fx-rise linear infinite }
.fx-drift   { animation:fx-drift linear infinite }
.fx-twinkle { animation:fx-twinkle ease-in-out infinite }
.fx-pulse   { animation:fx-pulse ease-in-out infinite alternate }
.fx-bob     { animation:fx-bob ease-in-out infinite alternate }
.fx-sway    { transform-box:fill-box; transform-origin:50% 0; animation:fx-sway ease-in-out infinite alternate }
.fx-flicker { transform-box:fill-box; transform-origin:50% 100%; animation:fx-flicker ease-in-out infinite alternate }
.fx-burst   { transform-box:fill-box; transform-origin:center; animation:fx-burst ease-out infinite }
.fx-spin    { transform-box:fill-box; transform-origin:center; animation:fx-spin linear infinite }
.fx-flap    { transform-box:fill-box; transform-origin:center; animation:fx-flap .28s ease-in-out infinite alternate }
.fx-wave    { transform-box:fill-box; transform-origin:0 50%; animation:fx-wave 1.6s ease-in-out infinite alternate }
.fx-flash   { animation:fx-flash 7s linear infinite }
.fx-flow    { animation:fx-flow linear infinite }
@keyframes fx-fall    { from { transform:translate(0,-40px) rotate(0) } to { transform:translate(var(--dx,0px),390px) rotate(var(--rot,0deg)) } }
@keyframes fx-rise    { 0% { transform:translateY(0); opacity:0 } 15% { opacity:.9 } 100% { transform:translate(var(--dx,0px),-360px); opacity:0 } }
@keyframes fx-drift   { from { transform:translateX(-300px) } to { transform:translateX(1500px) } }
@keyframes fx-twinkle { 50% { opacity:.12 } }
@keyframes fx-pulse   { from { opacity:.35 } to { opacity:1 } }
@keyframes fx-bob     { from { transform:translateY(-7px) } to { transform:translateY(7px) } }
@keyframes fx-sway    { from { transform:rotate(var(--a,-6deg)) } to { transform:rotate(calc(var(--a,-6deg) * -1)) } }
@keyframes fx-flicker { 0% { transform:scale(1,1); opacity:1 } 50% { transform:scale(.86,1.14) } 100% { transform:scale(1.08,.9); opacity:.82 } }
@keyframes fx-burst   { 0% { transform:scale(.05); opacity:0 } 10% { opacity:1 } 65% { opacity:.9 } 100% { transform:scale(1); opacity:0 } }
@keyframes fx-spin    { to { transform:rotate(360deg) } }
@keyframes fx-flap    { from { transform:scaleY(1) } to { transform:scaleY(.25) } }
@keyframes fx-wave    { from { transform:skewY(-4deg) scaleX(.97) } to { transform:skewY(4deg) scaleX(1) } }
@keyframes fx-flow    { to { transform:translateX(200px) } }
@keyframes fx-flash   { 0%,58%,61%,64%,100% { opacity:0 } 59%,62.5% { opacity:1 } }

.fx-drop  { animation:fx-drop 11s .6s cubic-bezier(.3,.7,.4,1) infinite; transform:translateY(-120px) }
.fx-swing { transform-box:fill-box; transform-origin:50% 0; animation:fx-swing 2.6s ease-in-out infinite alternate }
.fx-legs  { animation:fx-legs .5s ease-in-out infinite alternate }
@keyframes fx-drop  { 0% { transform:translateY(-120px) } 9% { transform:translateY(178px) } 12% { transform:translateY(150px) }
                      15% { transform:translateY(165px) } 72% { transform:translateY(165px) } 86%,100% { transform:translateY(-120px) } }
@keyframes fx-swing { from { transform:rotate(-1.6deg) } to { transform:rotate(1.6deg) } }
@keyframes fx-legs  { to { transform:scale(1.05,.94) } }

    @media (prefers-reduced-motion: reduce) { * { animation:none !important } }
  </style>
  
  <radialGradient id="glow" cx="12%" cy="0%" r="70%">
    <stop offset="0%" stop-color="#58A6FF" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="wishG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFD43B"/>
    <stop offset="100%" stop-color="#FF8787"/>
  </linearGradient>
  <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="100%" stop-color="#8FB4FF"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/>
  </pattern>
</defs>
<clipPath id="bc"><rect width="1200" height="350" rx="16"/></clipPath><rect width="1200" height="350" rx="16" fill="#0D1117"/><rect x=".5" y=".5" width="1199" height="349" rx="15.5" fill="none" stroke="#21262D"/>
<g clip-path="url(#bc)">
  <rect width="1200" height="350" fill="url(#grid)"/>
  <rect width="1200" height="350" fill="url(#glow)"/>
  
  <g class="inv" opacity=".85"><g transform="translate(0 14)"><rect x="6" y="0" width="3" height="3" fill="#3FB950"/><rect x="24" y="0" width="3" height="3" fill="#3FB950"/><rect x="9" y="3" width="3" height="3" fill="#3FB950"/><rect x="21" y="3" width="3" height="3" fill="#3FB950"/><rect x="6" y="6" width="3" height="3" fill="#3FB950"/><rect x="9" y="6" width="3" height="3" fill="#3FB950"/><rect x="12" y="6" width="3" height="3" fill="#3FB950"/><rect x="15" y="6" width="3" height="3" fill="#3FB950"/><rect x="18" y="6" width="3" height="3" fill="#3FB950"/><rect x="21" y="6" width="3" height="3" fill="#3FB950"/><rect x="24" y="6" width="3" height="3" fill="#3FB950"/><rect x="3" y="9" width="3" height="3" fill="#3FB950"/><rect x="6" y="9" width="3" height="3" fill="#3FB950"/><rect x="12" y="9" width="3" height="3" fill="#3FB950"/><rect x="15" y="9" width="3" height="3" fill="#3FB950"/><rect x="18" y="9" width="3" height="3" fill="#3FB950"/><rect x="24" y="9" width="3" height="3" fill="#3FB950"/><rect x="27" y="9" width="3" height="3" fill="#3FB950"/><rect x="0" y="12" width="3" height="3" fill="#3FB950"/><rect x="3" y="12" width="3" height="3" fill="#3FB950"/><rect x="6" y="12" width="3" height="3" fill="#3FB950"/><rect x="9" y="12" width="3" height="3" fill="#3FB950"/><rect x="12" y="12" width="3" height="3" fill="#3FB950"/><rect x="15" y="12" width="3" height="3" fill="#3FB950"/><rect x="18" y="12" width="3" height="3" fill="#3FB950"/><rect x="21" y="12" width="3" height="3" fill="#3FB950"/><rect x="24" y="12" width="3" height="3" fill="#3FB950"/><rect x="27" y="12" width="3" height="3" fill="#3FB950"/><rect x="30" y="12" width="3" height="3" fill="#3FB950"/><rect x="0" y="15" width="3" height="3" fill="#3FB950"/><rect x="6" y="15" width="3" height="3" fill="#3FB950"/><rect x="9" y="15" width="3" height="3" fill="#3FB950"/><rect x="12" y="15" width="3" height="3" fill="#3FB950"/><rect x="15" y="15" width="3" height="3" fill="#3FB950"/><rect x="18" y="15" width="3" height="3" fill="#3FB950"/><rect x="21" y="15" width="3" height="3" fill="#3FB950"/><rect x="24" y="15" width="3" height="3" fill="#3FB950"/><rect x="30" y="15" width="3" height="3" fill="#3FB950"/><rect x="0" y="18" width="3" height="3" fill="#3FB950"/><rect x="6" y="18" width="3" height="3" fill="#3FB950"/><rect x="24" y="18" width="3" height="3" fill="#3FB950"/><rect x="30" y="18" width="3" height="3" fill="#3FB950"/><rect x="9" y="21" width="3" height="3" fill="#3FB950"/><rect x="12" y="21" width="3" height="3" fill="#3FB950"/><rect x="18" y="21" width="3" height="3" fill="#3FB950"/><rect x="21" y="21" width="3" height="3" fill="#3FB950"/></g></g>
</g>

<!-- intro -->
<g>
  <text x="64" y="92" class="mono" font-size="13" letter-spacing="2.4" fill="#8B949E">HELLO, WORLD — I'M</text>
</g>
<g>
  <text x="62" y="162" font-size="72" font-weight="700" letter-spacing="-2" fill="url(#nameG)">Guru Kannan</text>
